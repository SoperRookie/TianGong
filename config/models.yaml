# LLM 模型配置（F-1-1 ~ F-1-5）
# 说明：
# - 所有模型统一走 OpenAI 兼容协议（chat/completions）。
# - api_key_env 为密钥所在的环境变量名，密钥本身不写入本文件。
# - supports_vision 标记多模态能力，图片类需求自动路由至 Vision 模型（F-1-5）。
# - 新增厂商/模型只需追加条目，无需改代码；私有化 Ollama/vLLM 同样以条目形式接入。

default_model: deepseek-chat

# 单模型调用失败的自动重试次数（F-1-6）；重试耗尽后按各模型的 fallbacks 依序降级
max_retries: 1

models:
  - name: deepseek-chat
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat
    supports_vision: false
    temperature: 0.3
    max_tokens: 8192
    timeout: 120
    fallbacks: [deepseek-reasoner]

  - name: deepseek-reasoner
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-reasoner
    supports_vision: false
    temperature: 0.3
    max_tokens: 16384
    timeout: 300

  # 私有化 Vision 模型（F-2-3 图片需求解析）：Windows + RTX 4090 16G，Ollama 部署
  - name: qwen-vl-local
    provider: ollama
    base_url: http://192.168.0.152:11434/v1
    api_key_env: null
    # 派生别名：qwen3-vl:8b + PARAMETER num_ctx 16384（经 /api/create 固化；2026-08-09
    # 由 30b 换为 8b——机器上模型清理后重建，别名不变则此处无需随底模调整）
    model: qwen3-vl-16k
    supports_vision: true
    temperature: 0.2
    # 思考型模型：思考与正文共享输出额度，需给足
    max_tokens: 10240
    timeout: 300

  # ---- 以下为示例条目，接入时取消注释并配置对应环境变量 ----

