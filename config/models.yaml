  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   api_key_env: DASHSCOPE_API_KEY
  #   model: qwen-vl-max
  #   supports_vision: true

  # - name: gpt-4o
  #   provider: openai
  #   base_url: https://api.openai.com/v1
  #   api_key_env: OPENAI_API_KEY
  #   model: gpt-4o
  #   supports_vision: true

  # - name: qwen3-local            # 后期私有化部署示例（Ollama / vLLM）
  #   provider: ollama
  #   base_url: http://内网推理服务:11434/v1
  #   api_key_env: null            # 内网服务可无鉴权
  #   model: qwen3:32b
  #   supports_vision: false

# ---- Embedding 模型（F-7-10）：知识库切片向量化，与 LLM 同构的多厂商设计 ----
# 选型以 POC-R8 结论为准；当前默认内网 Ollama 部署的 bge-m3（1024 维）。
default_embedding: bge-m3-local

embeddings:
  - name: bge-m3-local
    provider: ollama
    base_url: http://192.168.0.152:11434/v1
    api_key_env: null
    model: bge-m3:latest
    dimensions: 1024
    timeout: 60

