# LLM 模型配置（F-1-1 ~ F-1-5）
# 说明：
# - 所有模型统一走 OpenAI 兼容协议（chat/completions）。
# - api_key_env 为密钥所在的环境变量名，密钥本身不写入本文件。
# - supports_vision 标记多模态能力，图片类需求自动路由至 Vision 模型（F-1-5）。
# - 新增厂商/模型只需追加条目，无需改代码；DeepSeek / 智谱 / 百炼等商用 API 与私有化
#   Ollama / vLLM 同样以条目形式接入，文末保留示例，接入路径不因当前选型而收窄。
# - 当前选型：公司采购 OpenAI GPT，生成 / 评审 / 图片理解全部走 GPT（provider 须为
#   openai，客户端据此改传 max_completion_tokens）。

default_model: gpt-5.4

# 单模型调用失败的自动重试次数（F-1-6）；重试耗尽后按各模型的 fallbacks 依序降级
max_retries: 1

models:
  # 默认模型：生成、需求分析、AI 修改；支持图片输入，图片需求无需另配 Vision 模型
  - name: gpt-5.4
    provider: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-5.4
    supports_vision: true
    temperature: 0.3
    max_tokens: 16384
    timeout: 300
    fallbacks: [gpt-5.4-mini]

  # 评审模型：生成任务中指定为 reviewer_model，交叉评审更严格
  - name: gpt-5.5
    provider: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-5.5
    supports_vision: true
    # 纯推理模型：只接受默认温度 1，传其他值直接 400
    temperature: 1
    max_tokens: 16384
    timeout: 300
    fallbacks: [gpt-5.4]

  # 轻量档：便宜快速，作默认模型的降级备用，也适合改写等小任务
  - name: gpt-5.4-mini
    provider: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-5.4-mini
    supports_vision: true
    temperature: 0.3
    max_tokens: 16384
    timeout: 180

