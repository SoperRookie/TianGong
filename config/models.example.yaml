# ---- Embedding 模型（F-7-10）：知识库切片向量化，与 LLM 同构的多厂商设计 ----
# 当前选型随 LLM 一并采购 OpenAI：text-embedding-3-large（3072 维）。
# dimensions 必须与模型实际输出一致，建库时用于校验；更换 Embedding 模型后
# 向量维度变化，需删除 data/knowledge 重新入库。
default_embedding: text-embedding-3-large

embeddings:
  - name: text-embedding-3-large
    provider: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: text-embedding-3-large
    dimensions: 3072
    timeout: 60

