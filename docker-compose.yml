# 天工 Docker 部署：mysql + app + nginx
# 使用：cp .env.example .env 并填写；docker compose up -d --build
# 说明见 docs/Docker部署文档.md
name: tiangong

services:
  mysql:
    image: mysql:8.0
    container_name: tiangong-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tiangong
      MYSQL_USER: tiangong
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - tiangong

  app:
    build: .
    image: tiangong:${TIANGONG_VERSION:-latest}
    container_name: tiangong-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的数据库地址：容器内经服务名 mysql 访问
      TIANGONG_DB_URL: mysql+pymysql://tiangong:${MYSQL_PASSWORD}@mysql:3306/tiangong?charset=utf8mb4
      # nginx 容器固定 IP（见 networks），只有它转发的 X-Forwarded-For 才被采信
      TIANGONG_TRUSTED_PROXIES: 172.28.0.10
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./outputs:/app/outputs          # 上传原件、导出文件、执行附件、实例锁
      - ./data:/app/data                # 本地向量库 data/knowledge（嵌入式 Qdrant）
      - ./logs:/app/logs
      - ./config:/app/config           # models.yaml：页面「模型配置」保存会原子替换文件，须挂目录而非单文件，改完即热重载
    # Ollama 跑在宿主机时，models.yaml 里的地址写 http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 不经 nginx 直接暴露时取消注释（局域网直连 http://<宿主机IP>:8000）
    # ports:
    #   - "8000:8000"
    networks:
      - tiangong

  nginx:
    image: nginx:1.27-alpine
    container_name: tiangong-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      # 启用 HTTPS 时打开，并在 docker/nginx.conf 增加 443 server 块
      # - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./docker/certs:/etc/nginx/certs:ro
    networks:
      tiangong:
        ipv4_address: 172.28.0.10

volumes:
  mysql-data:

networks:
  tiangong:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
