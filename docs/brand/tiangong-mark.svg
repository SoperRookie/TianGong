<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b63f0"/><stop offset="1" stop-color="#7a4ce8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fe1ff"/><stop offset="1" stop-color="#c8b6ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- 天：一 -->
  <rect x="21" y="15" width="22" height="5" rx="2.5" fill="url(#sky)"/>
  <!-- 天：大 的横 -->
  <rect x="13" y="26.5" width="38" height="5" rx="2.5" fill="#fff"/>
  <!-- 天：人 —— 两笔向下展开，成为连接线 -->
  <path d="M32 31 L17 51" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M32 31 L47 51" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- 网络节点 -->
  <circle cx="32" cy="29" r="4.2" fill="#0b1226" stroke="#fff" stroke-width="2.4"/>
  <circle cx="17" cy="51" r="3.4" fill="#9fe1ff"/>
  <circle cx="47" cy="51" r="3.4" fill="#c8b6ff"/>
</svg>
