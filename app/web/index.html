<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestCase Agent</title>
<style>
:root { --primary:#2f5aa8; --bg:#f5f6f8; --border:#dde1e6; --danger:#c0392b; --ok:#1e8449; --warn:#c98a1b; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#222; }
header { background:var(--primary); color:#fff; padding:10px 20px; font-size:17px; font-weight:600; }
header small { font-weight:400; opacity:.8; margin-left:10px; }
.layout { display:flex; gap:14px; padding:14px; align-items:flex-start; }
.panel { background:#fff; border:1px solid var(--border); border-radius:8px; padding:14px; }
.left { width:360px; flex-shrink:0; display:flex; flex-direction:column; gap:14px; }
.right { flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; }
h3 { margin:0 0 10px; font-size:15px; }
h4 { margin:12px 0 6px; font-size:14px; }
label { display:block; margin:8px 0 2px; color:#555; }
textarea,input[type=text],select { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:5px; font:inherit; }
textarea { resize:vertical; }
button { padding:6px 14px; border:none; border-radius:5px; background:var(--primary); color:#fff; cursor:pointer; font:inherit; }
button.secondary { background:#eef1f5; color:#333; }
button.danger { background:var(--danger); }
button.mini { padding:2px 8px; font-size:12px; }
button:disabled { opacity:.5; cursor:not-allowed; }
.task-item { padding:8px 10px; border:1px solid var(--border); border-radius:6px; margin-bottom:6px; cursor:pointer; }
.task-item:hover { border-color:var(--primary); }
.task-item.active { border-color:var(--primary); background:#eef3fb; }
.task-item .tid { font-family:monospace; font-size:12px; color:#666; }
.status { display:inline-block; padding:0 8px; border-radius:9px; font-size:12px; color:#fff; }
.status.completed { background:var(--ok); } .status.failed { background:var(--danger); }
.status.running,.status.queued { background:var(--warn); } .status.awaiting_confirmation { background:#7d3c98; }
.st { display:inline-block; padding:0 7px; border-radius:8px; font-size:12px; white-space:nowrap; }
.st.pending { background:#eef1f5; color:#555; }
.st.approved { background:#d5f0e0; color:var(--ok); }
.st.rejected { background:#fadbd8; color:var(--danger); }
table { width:100%; border-collapse:collapse; margin-top:8px; }
th,td { border:1px solid var(--border); padding:5px 8px; text-align:left; vertical-align:top; font-size:13px; }
th { background:#f0f2f5; }
td.steps { white-space:pre-wrap; font-size:12px; color:#444; }
.prio { font-weight:600; }
.prio.P0 { color:#c0392b; } .prio.P1 { color:#ca6f1e; } .prio.P2 { color:#b7950b; } .prio.P3 { color:#7f8c8d; }
.hint { color:#777; font-size:12px; }
.warn { color:var(--warn); font-size:12px; }
.chips span { display:inline-block; background:#fbeee6; border:1px solid #eccb9d; border-radius:4px; padding:1px 8px; margin:2px; font-size:12px; }
.cov span { display:inline-block; border-radius:4px; padding:1px 8px; margin:2px; font-size:12px; border:1px solid var(--border); }
.cov .c-ok { background:#d5f0e0; } .cov .c-miss { background:#fadbd8; }
.cov .c-na { background:#eef1f5; color:#888; } .cov .c-tbd { background:#fdf6e3; }
.chat { max-height:220px; overflow:auto; border:1px solid var(--border); border-radius:6px; padding:8px; background:#fafbfc; }
.chat .msg { margin:4px 0; } .chat .me { color:var(--primary); }
.dl a { margin-right:12px; }
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
.tabs { display:flex; gap:4px; margin-top:8px; }
.tabs button { background:#eef1f5; color:#333; }
.tabs button.on { background:var(--primary); color:#fff; }
dialog { border:1px solid var(--border); border-radius:8px; width:520px; max-width:90vw; }
dialog h3 { margin-top:0; }
.spin { display:inline-block; width:12px; height:12px; border:2px solid #ccc; border-top-color:var(--primary); border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px; }
@keyframes sp { to { transform:rotate(360deg); } }
.progress { height:10px; background:#e8ebf0; border-radius:5px; overflow:hidden; margin:10px 0 6px; }
.progress .bar { height:100%; border-radius:5px; transition:width .8s ease;
  background:repeating-linear-gradient(45deg, var(--primary) 0 12px, #4a76c4 12px 24px);
  background-size:200% 100%; animation:flow 1.2s linear infinite; }
@keyframes flow { to { background-position:-34px 0; } }
.steps { display:flex; justify-content:space-between; font-size:12px; color:#999; }
.steps span.on { color:var(--primary); font-weight:600; }
.steps span.done { color:var(--ok); }
.diffbox { border:1px solid var(--border); border-radius:6px; padding:8px; background:#fafbfc; margin-top:8px; font-size:12px; }
.diffbox .del { color:var(--danger); text-decoration:line-through; }
.diffbox .add { color:var(--ok); }
.module-head { background:#f0f2f5; font-weight:600; }
</style>
</head>
<body>
<header>TestCase Agent<small>AI 测试用例生成平台（生成质量闭环版）</small></header>
<div class="layout">
  <div class="left">
    <div class="panel">
      <h3>新建任务</h3>
      <label>需求文本（可与文件混合提交）</label>
      <textarea id="reqText" rows="5" placeholder="粘贴需求内容…"></textarea>
      <label>需求文件（PDF / Word / 图片 / 文本，可多选）</label>
      <input type="file" id="reqFiles" multiple>
      <label>生成模型 / 评审模型</label>
      <div style="display:flex;gap:6px">
        <select id="modelSel"></select><select id="reviewerSel"></select>
      </div>
      <label>用例模板</label>
      <select id="templateSel"></select>
      <label>项目名（可选，同项目任务共享项目记忆与规则）</label>
      <input type="text" id="projectInput" placeholder="如：斗地主赛季玩法">

      <div class="toolbar">
        <label style="margin:0"><input type="checkbox" id="confirmPoints" checked> 先审核测试点</label>
        <label style="margin:0"><input type="checkbox" id="asyncMode" checked> 后台执行</label>
      </div>
      <div class="toolbar">
        <button id="createBtn" onclick="createTask()">生成测试用例</button>
        <span id="createMsg" class="hint"></span>
      </div>
    </div>
    <div class="panel">
      <h3>任务列表 <span id="listSpin"></span></h3>
      <div id="taskList"></div>
    </div>
    <div class="panel">
      <h3>学习规则（人工确认后反哺生成）</h3>
      <div id="ruleList" class="hint">加载中…</div>
      <div class="toolbar">
        <button class="secondary" onclick="analyzeLearning()" id="learnBtn">分析修改习惯</button>
      </div>
      <div class="hint">从人工审核修改留痕中提炼规则候选，负责人确认范围后自动注入后续生成</div>
    </div>
    <div class="panel">
      <h3>记忆（用户偏好 / 项目记忆）</h3>
      <div id="memList" class="hint">加载中…</div>
      <div class="toolbar">
        <button class="secondary" onclick="openMemDlg()">新增记忆</button>
        <button class="danger" onclick="clearMemories()">一键清空</button>
      </div>
      <div class="hint">生成任务时自动注入（独立配额），任务详情可见本次引用了哪些记忆</div>
    </div>
  </div>
  <div class="right" id="detail">
    <div class="panel hint">选择或创建一个任务查看详情</div>
  </div>
</div>

<dialog id="memDlg">
  <h3>记忆</h3>
  <label>维度</label>
  <select id="mScope" onchange="document.getElementById('mProject').style.display=this.value==='project'?'':'none'">
    <option value="user">用户偏好</option><option value="project">项目记忆</option>
  </select>
  <input type="text" id="mProject" placeholder="项目名" style="display:none;margin-top:6px">
  <label>内容</label>
  <textarea id="mContent" rows="4" placeholder="如：用例步骤保持精简，每条不超过 5 步"></textarea>
  <div class="toolbar">
    <button onclick="saveMemory()">保存</button>
    <button class="secondary" onclick="document.getElementById('memDlg').close()">取消</button>
  </div>
</dialog>

<dialog id="editDlg">
  <h3>修改用例 <span id="editCaseId" class="hint"></span></h3>
  <label>标题</label><input type="text" id="eTitle">
  <label>优先级</label>
  <select id="ePrio"><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select>
  <label>前置条件</label><input type="text" id="ePre">
  <label>测试步骤（每行一步：动作 =&gt; 预期）</label>
  <textarea id="eSteps" rows="5"></textarea>
  <label>关键词</label><input type="text" id="eKeywords">
  <label>备注</label><input type="text" id="eRemark">
  <label>反馈（可选，说明修改原因——学习语料）</label><input type="text" id="eFeedback">
  <div class="toolbar">
    <button onclick="saveEdit()">保存（人工定稿即通过并锁定）</button>
    <button class="secondary" onclick="document.getElementById('editDlg').close()">取消</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
let currentTask = null;
let editingCase = null;
let caseTab = 'all';                 // 用例视图筛选：all / rejected / approved / pending
let hiddenDupPairs = new Set();      // 忽略的重复提示（本地）
let lastPointDiff = null;            // 最近一次测试点定点修改 Diff
let lastCaseDiff = null;             // 最近一次用例定点修改 Diff
let lastHints = [];                  // 连续驳回提示

async function api(path, opts) {
  const resp = await fetch(path, opts);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || resp.statusText);
  return data;
}
const jpost = (path, body) => api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});

/* ---- 初始化 ---- */
async function init() {
  const m = await api('/api/v1/models');
  for (const sel of [$('modelSel'), $('reviewerSel')]) {
    sel.innerHTML = '';
    sel.add(new Option(sel === $('modelSel') ? '生成:默认' : '评审:同生成', ''));
    m.models.forEach(x => sel.add(new Option(x.name, x.name)));
  }
  const t = await api('/api/v1/templates');
  $('templateSel').innerHTML = '';
  t.templates.forEach(x => $('templateSel').add(
    new Option(x.name + (x.template_id === t.default_id ? '（默认）' : ''), x.template_id)));
  $('templateSel').value = t.default_id;
  await refreshMemories(true);
  refreshRules();
  refreshList();
  setInterval(refreshList, 3000);
  setInterval(() => {
    if (currentTask && ['queued','running'].includes(currentTask.status)) renderDetail();
  }, 1000);
}

/* ---- 学习规则（需求三十六~三十九）---- */
async function refreshRules() {
  const data = await api('/api/v1/learning/rules');
  const scopeText = {system:'系统', team:'团队', project:'项目', module:'模块'};
  const rows = data.rules.filter(r => r.status !== 'ignored').map(r => `
    <div class="task-item" style="cursor:default">
      <div>
        ${r.status==='candidate' ? '<span class="st pending">候选</span>' : `<span class="st approved">${scopeText[r.scope]||r.scope}级生效</span>`}
        ${r.confidence ? `<span class="hint">可信度:${esc(r.confidence)}</span>` : ''}
        <span style="float:right;white-space:nowrap">
          ${r.status==='candidate' ? `<a href="#" onclick="confirmRule('${r.rule_id}');return false">确认</a>
          <a href="#" onclick="ignoreRule('${r.rule_id}');return false" style="color:#888">忽略</a>` :
          `<a href="#" onclick="deleteRule('${r.rule_id}');return false" style="color:var(--danger)">删</a>`}
        </span>
      </div>
      <div style="font-size:12px;color:#444">${esc(r.content)}</div>
      ${r.evidence ? `<div class="hint">依据：${esc(r.evidence)}</div>` : ''}
    </div>`).join('');
  $('ruleList').innerHTML = rows || '<div class="hint">暂无规则。点击「分析修改习惯」从审核留痕提炼候选</div>';
}
async function analyzeLearning() {
  $('learnBtn').disabled = true; $('learnBtn').innerHTML = '<span class="spin"></span> 分析中…';
  try {
    const project = $('projectInput').value.trim() || null;
    const data = await jpost('/api/v1/learning/analyze', {project});
    alert(data.message || `分析 ${data.samples} 条留痕，新增 ${data.candidates.length} 条规则候选（需人工确认）`);
    refreshRules();
  } catch (e) { alert('分析失败: ' + e.message); }
  $('learnBtn').disabled = false; $('learnBtn').textContent = '分析修改习惯';
}
async function confirmRule(id) {
  const scope = window.prompt('规则适用范围：system（所有项目）/ team（团队）/ project（项目）/ module（模块）', 'team');
  if (!scope) return;
  let project = null, module = null;
  if (['project','module'].includes(scope)) {
    project = window.prompt('项目名：', $('projectInput').value.trim());
    if (!project) return;
    if (scope === 'module') { module = window.prompt('模块名：'); if (!module) return; }
  }
  try { await jpost(`/api/v1/learning/rules/${id}/confirm`, {scope, project, module}); refreshRules(); }
  catch (e) { alert('确认失败: ' + e.message); }
}
async function ignoreRule(id) {
  try { await jpost(`/api/v1/learning/rules/${id}/ignore`, {}); refreshRules(); }
  catch (e) { alert('操作失败: ' + e.message); }
}
async function deleteRule(id) {
  try { await api(`/api/v1/learning/rules/${id}`, {method:'DELETE'}); refreshRules(); }
  catch (e) { alert('删除失败: ' + e.message); }
}

/* ---- 记忆管理 ---- */
async function refreshMemories(applyDefaults) {
  const data = await api('/api/v1/memories');
  if (applyDefaults) {
    const d = data.defaults || {};
    if (d.template_id && [...$('templateSel').options].some(o=>o.value===d.template_id)) $('templateSel').value = d.template_id;
    if (d.model && [...$('modelSel').options].some(o=>o.value===d.model)) $('modelSel').value = d.model;
  }
  $('memList').innerHTML = data.memories.map(m => `
    <div class="task-item" style="cursor:default">
      <div><b>${m.scope==='project'?'[项目] '+esc(m.project||''):'[偏好]'}</b>
        ${m.source==='usage'?'<span class="hint">（自动沉淀）</span>':''}
        <span style="float:right;white-space:nowrap">
          <a href="#" onclick="editMemory('${m.memory_id}');return false">改</a>
          <a href="#" onclick="deleteMemory('${m.memory_id}');return false" style="color:var(--danger)">删</a></span></div>
      <div style="font-size:12px;color:#444">${esc(m.content)}</div>
    </div>`).join('') || '<div class="hint">暂无记忆。可手工添加，或随使用自动沉淀</div>';
  window._memories = data.memories;
}
function openMemDlg() { $('mContent').value=''; $('mScope').value='user'; $('mProject').style.display='none'; $('memDlg').showModal(); }
async function saveMemory() {
  try {
    await jpost('/api/v1/memories', {content:$('mContent').value, scope:$('mScope').value, project:$('mProject').value||null});
    $('memDlg').close(); refreshMemories();
  } catch (e) { alert('保存失败: '+e.message); }
}
async function editMemory(id) {
  const m = (window._memories||[]).find(x=>x.memory_id===id);
  const content = window.prompt('修改记忆内容（纠错）：', m ? m.content : '');
  if (content === null || !content.trim()) return;
  try { await api('/api/v1/memories/'+id, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content})}); refreshMemories(); }
  catch (e) { alert('修改失败: '+e.message); }
}
async function deleteMemory(id) {
  try { await api('/api/v1/memories/'+id, {method:'DELETE'}); refreshMemories(); }
  catch (e) { alert('删除失败: '+e.message); }
}
async function clearMemories() {
  if (!window.confirm('确认清空全部记忆？（含自动沉淀的偏好与使用计数）')) return;
  await api('/api/v1/memories', {method:'DELETE'});
  refreshMemories();
}

/* ---- 任务列表 ---- */
async function refreshList() {
  const data = await api('/api/v1/tasks');
  $('listSpin').innerHTML = data.tasks.some(t => ['queued','running'].includes(t.status)) ? '<span class="spin"></span>' : '';
  $('taskList').innerHTML = data.tasks.map(t => `
    <div class="task-item ${currentTask && currentTask.task_id===t.task_id?'active':''}" onclick="openTask('${t.task_id}')">
      <div><span class="status ${t.status}">${statusText(t.status)}</span>
        ${t.progress?'<span class="hint">'+progressText(t.progress)+'</span>':''}
        <span style="float:right" class="hint">${t.case_count?t.case_count+' 条用例':''}</span></div>
      <div class="tid">${t.task_id} · ${(t.sources||[]).map(shortName).join(', ')||'-'}</div>
    </div>`).join('') || '<div class="hint">暂无任务</div>';
  if (currentTask && ['queued','running'].includes(currentTask.status)) openTask(currentTask.task_id, true);
}
const statusText = s => ({completed:'完成', failed:'失败', running:'执行中', queued:'排队中', awaiting_confirmation:'审核测试点'}[s]||s);
const progressText = p => ({analyzing:'需求分析', generating_reviewing:'生成与评审', exporting:'导出'}[p]||p);
const shortName = s => s.length>18 ? s.slice(0,15)+'…' : s;
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- 创建任务 ---- */
async function createTask() {
  const fd = new FormData();
  fd.append('text', $('reqText').value);
  for (const f of $('reqFiles').files) fd.append('files', f);
  if ($('modelSel').value) fd.append('model', $('modelSel').value);
  if ($('reviewerSel').value) fd.append('reviewer_model', $('reviewerSel').value);
  if ($('projectInput').value.trim()) fd.append('project', $('projectInput').value.trim());
  fd.append('template_id', $('templateSel').value);
  fd.append('confirm_points', $('confirmPoints').checked);
  fd.append('async_mode', $('asyncMode').checked && !$('confirmPoints').checked);
  $('createBtn').disabled = true;
  $('createMsg').innerHTML = '<span class="spin"></span> 提交中…';
  $('detail').innerHTML = `<div class="panel"><h3>已提交，解析需求中 <span class="spin"></span>
      <span class="hint">含文档/图片解析与拆解后自动查漏、查重</span></h3>
    <div class="progress"><div class="bar" style="width:12%"></div></div>
    <div class="steps"><span class="on">上传与解析</span><span>需求分析</span><span>生成与评审</span><span>导出</span></div></div>`;
  try {
    const data = await api('/api/v1/tasks', {method:'POST', body:fd});
    $('reqText').value = ''; $('reqFiles').value = '';
    refreshMemories();
    await refreshList(); openTask(data.task_id);
    $('createMsg').textContent = '';
  } catch (e) { $('createMsg').textContent = '失败: ' + e.message; $('detail').innerHTML = ''; }
  $('createBtn').disabled = false;
}

/* ---- 任务详情 ---- */
async function openTask(id, keepLocal) {
  currentTask = await api('/api/v1/tasks/' + id);
  if (!keepLocal) { hiddenDupPairs = new Set(); lastPointDiff = null; lastCaseDiff = null; lastHints = []; caseTab = 'all'; }
  renderDetail();
  refreshList();
}

function renderDetail() {
  const t = currentTask;
  let html = `<div class="panel"><h3>任务 <code>${t.task_id}</code>
    <span class="status ${t.status}">${statusText(t.status)}</span>
    ${t.progress?'<span class="hint"> '+progressText(t.progress)+' <span class="spin"></span></span>':''}</h3>
    <div class="hint">来源：${(t.sources||[]).map(esc).join('、')||'-'} · 创建于 ${t.created_at||''}</div>
    ${t.error?'<p style="color:var(--danger)">'+esc(t.error)+'</p>':''}</div>`;

  if (['queued','running'].includes(t.status)) html += renderProgress(t);
  if (t.status === 'awaiting_confirmation') html += renderPointWorkbench(t);
  if (t.result && t.result.cases && t.result.cases.length) html += renderResult(t);
  $('detail').innerHTML = html;
}

const STAGES = [['queued','排队'], ['analyzing','需求分析'], ['generating_reviewing','生成与评审'], ['exporting','导出']];
const STAGE_PCT = {queued:8, analyzing:30, generating_reviewing:70, exporting:92};
function renderProgress(t) {
  const stage = t.progress || 'queued';
  const idx = Math.max(0, STAGES.findIndex(s => s[0] === stage));
  const elapsed = t.created_at ? Math.max(0, Math.floor((Date.now() - new Date(t.created_at).getTime())/1000)) : 0;
  const mm = String(Math.floor(elapsed/60)), ss = String(elapsed%60).padStart(2,'0');
  return `<div class="panel"><h3>正在生成 <span class="spin"></span>
      <span class="hint">已耗时 ${mm}:${ss} · 生成与评审为主要耗时阶段（多模块并行）</span></h3>
    <div class="progress"><div class="bar" style="width:${STAGE_PCT[stage] || 8}%"></div></div>
    <div class="steps">${STAGES.map((s,i) =>
      `<span class="${i < idx ? 'done' : i === idx ? 'on' : ''}">${i < idx ? '✓ ' : ''}${s[1]}</span>`).join('')}
    </div></div>`;
}

/* ==== 测试点审核工作台（需求四十六~五十六）==== */

function allPoints(t) {
  const modules = (t.analysis||{}).test_points || [];
  return modules.flatMap(m => (m.points||[]).map(p => ({...p, module:m.module})));
}

function renderPointWorkbench(t) {
  const modules = (t.analysis||{}).test_points || [];
  const pts = allPoints(t);
  const approved = pts.filter(p=>p.status==='approved').length;
  const rejected = pts.filter(p=>p.status==='rejected').length;
  const pending = pts.length - approved - rejected;
  const srcText = {ai:'AI拆解', gap:'查漏新增', supplement:'AI补充', manual:'手工', ai_fix:'修改新增'};

  // 按需求分组审核（需求五十一）：模块分组行 + 组内测试点
  const rows = modules.map(m => {
    const head = `<tr class="module-head"><td colspan="7">
      <input type="checkbox" onclick="toggleModule('${esc(m.module)}',this.checked)">
      ${esc(m.module)} <span class="hint">（${(m.points||[]).length} 条）</span></td></tr>`;
    const body = (m.points||[]).map(p => `
      <tr>
        <td><input type="checkbox" class="ptck" data-tp="${esc(p.tp_id)}" data-mod="${esc(m.module)}"></td>
        <td>${esc(p.tp_id)}</td>
        <td>${esc(p.point)}
          ${(p.warnings||[]).map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}
          ${p.comment?`<div class="hint" style="color:var(--danger)">意见：${esc(p.comment)}</div>`:''}</td>
        <td>${esc(p.dimension||'-')}</td>
        <td class="hint">${srcText[p.source]||esc(p.source||'')}</td>
        <td><span class="st ${p.status}">${{pending:'待审核',approved:'已通过🔒',rejected:'已驳回'}[p.status]||p.status}</span>
          ${p.reject_count>1?`<div class="warn">驳回${p.reject_count}次</div>`:''}</td>
        <td style="white-space:nowrap">
          <button class="mini secondary" onclick="pointAct('${esc(p.tp_id)}','approve')">✓通过</button>
          <button class="mini secondary" onclick="pointModify('${esc(p.tp_id)}')">✎</button>
          <button class="mini secondary" onclick="pointReject('${esc(p.tp_id)}')">×驳回</button>
          <button class="mini secondary" onclick="pointAct('${esc(p.tp_id)}','delete')">🗑</button>
          ${p.status==='approved'?`<button class="mini secondary" onclick="pointAct('${esc(p.tp_id)}','unlock')">解锁</button>`:''}
        </td>
      </tr>`).join('');
    return head + body;
  }).join('');

  return `<div class="panel"><h3>测试点审核工作台
      <span class="hint">共 ${pts.length} 条 · 待审核 ${pending} · 已通过 ${approved} · 已驳回 ${rejected}</span></h3>
    ${renderCoverage(t)}
    ${renderReuseHints(t)}
    ${renderDupReport(t)}
    ${lastHints.length?`<div class="warn" style="margin-top:6px">${lastHints.map(esc).join('<br>')}</div>`:''}
    ${(t.analysis&&t.analysis.blind_spots&&t.analysis.blind_spots.length)?
      '<h4>疑似需求盲区</h4><div class="chips">'+t.analysis.blind_spots.map(b=>'<span>'+esc(b)+'</span>').join('')+'</div>':''}
    <table>
      <tr><th style="width:26px"></th><th>编号</th><th>测试点</th><th>维度</th><th>来源</th><th>状态</th><th>操作</th></tr>
      ${rows}
    </table>
    <div class="toolbar">
      <button class="secondary" onclick="batchPoints('approve')">批量通过（勾选）</button>
      <button class="secondary" onclick="batchPoints('reject')">批量驳回（统一意见）</button>
      ${rejected?`<button onclick="fixPoints()" id="fixPtBtn">AI 修改驳回项（${rejected}）</button>`:''}
      <button class="secondary" onclick="gapCheck()">查漏补缺</button>
      <button class="secondary" onclick="dupCheck()">重复检查</button>
      <button class="secondary" onclick="supplementPoints()">AI 补充测试点</button>
      <button class="secondary" onclick="manualAddPoint()">手工新增</button>
    </div>
    ${lastPointDiff?renderPointDiff(lastPointDiff):''}
    <div class="toolbar" style="border-top:1px solid var(--border);padding-top:10px">
      <button onclick="confirmPointsGo()" id="confirmBtn">确认并生成用例${approved?`（仅已通过的 ${approved} 条）`:'（全部未驳回项）'}</button>
      <span class="hint">通过=锁定为正式测试点；驳回项修改后需再审核，不进入生成</span>
    </div></div>`;
}

function renderCoverage(t) {
  if (!t.coverage) return '';
  const cls = {'已覆盖':'c-ok','未覆盖':'c-miss','不适用':'c-na','待确认':'c-tbd'};
  const icon = {'已覆盖':'✓','未覆盖':'⚠','不适用':'—','待确认':'?'};
  return `<h4>测试覆盖视图（独立查漏 Agent）</h4><div class="cov">${
    Object.entries(t.coverage).map(([d,s]) =>
      `<span class="${cls[s]||''}">${esc(d)} ${icon[s]||''} ${esc(s)}</span>`).join('')}</div>`;
}

function renderReuseHints(t) {
  if (!t.reuse_hints || !t.reuse_hints.length) return '';
  return `<h4>历史用例复用提示</h4>${t.reuse_hints.map(h=>`
    <div class="diffbox">发现历史正式用例与当前需求高度相关（相似度 ${h.score}，来源 ${esc(h.source)}）：
      <div class="hint" style="white-space:pre-wrap">${esc(h.text)}</div>
      <span class="hint">可复用为参考，或忽略；生成时该用例已注入拆解与评审上下文</span></div>`).join('')}`;
}

function renderDupReport(t) {
  const pairs = ((t.dup_report||{}).points||[]).filter(p=>!hiddenDupPairs.has(p.a+'|'+p.b));
  if (!pairs.length) return '';
  return `<h4>疑似重复测试点（AI 不删除，请人工处置）</h4>${pairs.map(p=>`
    <div class="diffbox">
      <b>${esc(p.a)}</b>「${esc(p.a_point)}」 与 <b>${esc(p.b)}</b>「${esc(p.b_point)}」
      相似度 ${p.similarity}${p.verdict?` · 判定：${esc(p.verdict)}`:''}
      ${p.reason?`<div class="hint">原因：${esc(p.reason)}</div>`:''}
      ${p.suggestion?`<div class="hint">建议：${esc(p.suggestion)}</div>`:''}
      <div class="toolbar">
        <button class="mini secondary" onclick="pointAct('${esc(p.a)}','delete')">删除 ${esc(p.a)}</button>
        <button class="mini secondary" onclick="pointAct('${esc(p.b)}','delete')">删除 ${esc(p.b)}</button>
        <button class="mini secondary" onclick="hiddenDupPairs.add('${esc(p.a)}|${esc(p.b)}');renderDetail()">忽略</button>
      </div></div>`).join('')}`;
}

function renderPointDiff(d) {
  return `<h4>AI 定点修改结果（修改前 → 修改后）</h4>${d.diff.map(x=>`
    <div class="diffbox">[${esc(x.comment_type||'')}] ${esc(x.tp_id)}
      ${x.action==='split'
        ? `<div><span class="del">${esc(x.before)}</span></div>` + x.after.map(a=>`<div class="add">+ ${esc(a)}</div>`).join('')
        : x.action==='delete'
        ? `<div><span class="del">${esc(x.before)}</span>（已删除）</div>`
        : `<div><span class="del">${esc(x.before)}</span></div><div class="add">${esc(x.after)}</div>`}
      ${x.note?`<div class="hint">${esc(x.note)}</div>`:''}</div>`).join('')}
    ${d.added && d.added.length ? '<div class="chips">'+d.added.map(a=>`<span>新增: ${esc(a.point)}</span>`).join('')+'</div>' : ''}`;
}

async function pointsReview(items) {
  try {
    const data = await jpost(`/api/v1/tasks/${currentTask.task_id}/points/review`, {items});
    lastHints = data.hints || [];
    await openTask(currentTask.task_id, true);
  } catch (e) { alert('操作失败: ' + e.message); }
}
const pointAct = (tp, action) => pointsReview([{tp_id:tp, action}]);
function pointReject(tp) {
  const comment = window.prompt('审核意见（必填，AI 将按意见定点修改）：');
  if (!comment || !comment.trim()) return;
  pointsReview([{tp_id:tp, action:'reject', comment:comment.trim()}]);
}
function pointModify(tp) {
  const p = allPoints(currentTask).find(x=>x.tp_id===tp);
  const text = window.prompt('修改测试点：', p ? p.point : '');
  if (!text || !text.trim()) return;
  pointsReview([{tp_id:tp, action:'modify', point:text.trim()}]);
}
function toggleModule(mod, checked) {
  document.querySelectorAll(`.ptck[data-mod="${CSS.escape(mod)}"]`).forEach(c=>c.checked=checked);
}
function checkedPoints() {
  return [...document.querySelectorAll('.ptck:checked')].map(c=>c.dataset.tp);
}
function batchPoints(action) {
  const tps = checkedPoints();
  if (!tps.length) return alert('请先勾选测试点');
  if (action === 'reject') {
    const comment = window.prompt(`批量驳回 ${tps.length} 条，统一审核意见（必填）：`, '与已有测试点重复，请合并处理');
    if (!comment || !comment.trim()) return;
    return pointsReview(tps.map(tp=>({tp_id:tp, action:'reject', comment:comment.trim()})));
  }
  pointsReview(tps.map(tp=>({tp_id:tp, action})));
}
async function fixPoints() {
  const btn = $('fixPtBtn'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> AI 修改中…'; }
  try {
    const data = await api(`/api/v1/tasks/${currentTask.task_id}/points/fix`, {method:'POST'});
    lastPointDiff = data;
    await openTask(currentTask.task_id, true);
  } catch (e) { alert('修改失败: ' + e.message); renderDetail(); }
}
async function gapCheck() {
  try {
    const data = await api(`/api/v1/tasks/${currentTask.task_id}/points/gap-check`, {method:'POST'});
    await openTask(currentTask.task_id, true);
    alert(`查漏完成：新增 ${data.added.length} 条待审核测试点（存量不变）`);
  } catch (e) { alert('查漏失败: ' + e.message); }
}
async function dupCheck() {
  try {
    const data = await api(`/api/v1/tasks/${currentTask.task_id}/points/dup-check`, {method:'POST'});
    hiddenDupPairs = new Set();
    await openTask(currentTask.task_id, true);
    if (!data.duplicates.length) alert('未发现疑似重复测试点');
  } catch (e) { alert('重复检查失败: ' + e.message); }
}
async function supplementPoints() {
  const instruction = window.prompt('AI 补充要求（只生成新增内容）：', '补充网络切换场景');
  if (!instruction || !instruction.trim()) return;
  try {
    const data = await jpost(`/api/v1/tasks/${currentTask.task_id}/points/add`, {instruction:instruction.trim()});
    await openTask(currentTask.task_id, true);
    alert(`AI 补充了 ${data.added.length} 条待审核测试点`);
  } catch (e) { alert('补充失败: ' + e.message); }
}
async function manualAddPoint() {
  const module = window.prompt('模块名：');
  if (!module) return;
  const point = window.prompt('测试点描述：');
  if (!point || !point.trim()) return;
  try {
    await jpost(`/api/v1/tasks/${currentTask.task_id}/points/add`, {points:[{module, point:point.trim()}]});
    await openTask(currentTask.task_id, true);
  } catch (e) { alert('新增失败: ' + e.message); }
}
let confirming = false;
async function confirmPointsGo() {
  if (confirming) return;
  confirming = true;
  document.querySelectorAll('#detail button').forEach(b=>b.disabled=true);
  currentTask.status = 'running'; currentTask.progress = 'generating_reviewing';
  renderDetail();
  try {
    await jpost(`/api/v1/tasks/${currentTask.task_id}/confirm`, {});
    await openTask(currentTask.task_id);
  } catch (e) {
    alert('生成失败: ' + e.message);
    await openTask(currentTask.task_id, true);
  }
  confirming = false;
}

/* ==== 用例审核（需求五十三~五十五）==== */

function caseState(t, c) {
  return (t.case_reviews||{})[c.uid] || {status:'pending', comment:'', reject_count:0, locked:false};
}

function renderResult(t) {
  const r = t.result;
  const states = r.cases.map(c => caseState(t, c));
  const nRejected = states.filter(s=>s.status==='rejected').length;
  const nApproved = states.filter(s=>s.status==='approved').length;
  const nPending = r.cases.length - nRejected - nApproved;
  const visible = r.cases.filter(c => {
    const s = caseState(t, c).status;
    return caseTab==='all' || s===caseTab;
  });

  const rows = visible.map(c => {
    const s = caseState(t, c);
    return `<tr>
      <td><input type="checkbox" class="cck" data-cid="${esc(c.case_id)}"></td>
      <td>${esc(c.case_id)}</td><td>${esc(c.module)}</td>
      <td>${esc(c.title)}
        ${s.comment?`<div class="hint" style="color:var(--danger)">意见：${esc(s.comment)}</div>`:''}</td>
      <td class="prio ${esc(c.priority)}">${esc(c.priority)}</td>
      <td class="steps">${(c.steps||[]).map((x,i)=>`${i+1}. ${esc(x.action)}\n   → ${esc(x.expected)}`).join('\n')}</td>
      <td class="hint">${esc(c.keywords||'')}</td>
      <td><span class="st ${s.status}">${{pending:'未审核',approved:'已通过🔒',rejected:'已驳回'}[s.status]}</span>
        ${s.reject_count>1?`<div class="warn">驳回${s.reject_count}次</div>`:''}</td>
      <td style="white-space:nowrap">
        <button class="mini secondary" onclick="caseAct('${esc(c.case_id)}','approve')">✓通过</button>
        <button class="mini secondary" onclick="openEdit('${esc(c.case_id)}')">✎</button>
        <button class="mini secondary" onclick="caseReject('${esc(c.case_id)}')">×驳回</button>
        <button class="mini secondary" onclick="caseAct('${esc(c.case_id)}','delete')">🗑</button>
        ${s.locked?`<button class="mini secondary" onclick="caseAct('${esc(c.case_id)}','unlock')">解锁</button>`:''}
      </td></tr>`;
  }).join('');

  return `<div class="panel"><h3>生成结果
      <span class="hint">${r.cases.length} 条 · AI 评审 ${r.review_rounds} 轮 · ${r.passed?'评审通过':'含未通过项'}${t.revisions.length?' · 已修订 '+t.revisions.length+' 轮':''}</span></h3>
    ${renderQuality(t)}
    ${r.blind_spots && r.blind_spots.length ? '<div class="chips">'+r.blind_spots.map(b=>'<span>'+esc(b)+'</span>').join('')+'</div>' : ''}
    ${t.memories && t.memories.length ? '<div class="chips">'+t.memories.map(m=>'<span>记忆: '+esc(m.content)+'</span>').join('')+'</div>' : ''}
    ${t.rules && t.rules.length ? '<div class="chips">'+t.rules.map(x=>'<span>规则: '+esc(x.content)+'</span>').join('')+'</div>' : ''}
    <div class="dl" style="margin-top:6px">下载：
      ${Object.keys(t.files||{}).map(f=>`<a href="/api/v1/tasks/${t.task_id}/files/${f}">${f}</a>`).join('')}
    </div>
    <div class="tabs">
      <button class="${caseTab==='all'?'on':''}" onclick="caseTab='all';renderDetail()">全部（${r.cases.length}）</button>
      <button class="${caseTab==='rejected'?'on':''}" onclick="caseTab='rejected';renderDetail()">待修改（${nRejected}）</button>
      <button class="${caseTab==='approved'?'on':''}" onclick="caseTab='approved';renderDetail()">已通过（${nApproved}）</button>
      <button class="${caseTab==='pending'?'on':''}" onclick="caseTab='pending';renderDetail()">未审核（${nPending}）</button>
    </div>
    <table><tr><th style="width:26px"><input type="checkbox" onclick="document.querySelectorAll('.cck').forEach(c=>c.checked=this.checked)"></th>
      <th>编号</th><th>模块</th><th>标题</th><th>优先级</th><th>步骤 → 预期</th><th>关键词</th><th>状态</th><th>操作</th></tr>${rows}</table>
    ${lastHints.length?`<div class="warn" style="margin-top:6px">${lastHints.map(esc).join('<br>')}</div>`:''}
    <div class="toolbar">
      <button class="secondary" onclick="batchCases('approve')">批量通过（锁定）</button>
      <button class="secondary" onclick="batchCases('reject')">批量驳回（统一意见）</button>

      <button class="secondary" onclick="reqDiff()" id="reqDiffBtn">分析差异</button>
      ${t.requirement_diff && !t.requirement_diff.applied ? `<button onclick="applyReqDiff()" id="applyDiffBtn">应用最小范围更新</button>` : ''}

    <div class="toolbar">
      <input type="text" id="reviseInput" placeholder="输入修订要求…" style="flex:1"
        onkeydown="if(event.key==='Enter')reviseGo()">
      <button onclick="reviseGo()" id="reviseBtn">发送</button>
    </div></div>

    <div class="panel"><h3>离线终稿回传</h3>
    <div class="toolbar">
      <input type="file" id="finalFile" accept=".xlsx,.csv,.xmind">
      <button class="secondary" onclick="uploadFinal()">上传并对比</button>
    </div>
    ${t.offline_review ? renderDiff(t.offline_review) : '<div class="hint">下载导出文件离线评审后，回传定稿自动计算差异，作为学习语料（左侧「分析修改习惯」可提炼规则）</div>'}
    </div>`;
}

function renderQuality(t) {
  const q = t.quality;
  if (!q) return '';
  const dup = q['疑似重复用例对'] || [];
  return `<div class="diffbox"><b>AI 自检（仅供参考，不作为自动通过依据）</b>
    <div class="chips">
      ${q['测试维度覆盖度']!=null?`<span>维度覆盖度 ${q['测试维度覆盖度']}</span>`:''}

      <span>待确认问题 ${q['待确认问题']}</span>
      <span>未解决评审问题 ${q['未解决评审问题']}</span>
      <span>历史用例参考 ${q['历史用例参考']}</span>
      <span>评审轮次 ${q['评审轮次']}</span>

}

function renderCaseDiff(d) {

    ? `<div class="diffbox">${esc(x.case_id)} 修改：${(x.changes||[]).map(c=>

    ? `<div class="diffbox"><span class="del">${esc(x.case_id)} 已删除</span></div>`
    : `<div class="diffbox"><span class="add">新增 ${esc(x.case_id)}：${esc((x.after||{}).title||'')}</span></div>`).join('')}`;
}

function renderReqDiff(rd) {
  return `<div class="diffbox"><b>${esc(rd.summary||'变更分析')}</b>${rd.applied?'<span class="st approved" style="margin-left:8px">已应用</span>':''}
    ${(rd.changes||[]).map(c=>`<div style="margin-top:4px">
      <span class="st pending">${esc(c.type)}</span> ${esc(c.description)}
      ${(c.affected_cases&&c.affected_cases.length)?`<div class="hint">受影响用例：${c.affected_cases.map(esc).join('、')}</div>`:''}
      ${(c.affected_points&&c.affected_points.length)?`<div class="hint">受影响测试点：${c.affected_points.map(esc).join('、')}</div>`:''}
      ${c.action_hint?`<div class="hint">建议：${esc(c.action_hint)}</div>`:''}</div>`).join('')}
    ${(rd.new_requirements&&rd.new_requirements.length)?`<div class="hint">新增需求：${rd.new_requirements.map(esc).join('；')}</div>`:''}

async function casesReview(items) {

    lastHints = (data.review||{}).hints || [];
    await openTask(currentTask.task_id, true);
    refreshMemories();

}
const caseAct = (cid, action) => casesReview([{case_id:cid, action}]);
function caseReject(cid) {

  casesReview([{case_id:cid, action:'reject', comment:comment.trim()}]);

function batchCases(action) {
  const ids = [...document.querySelectorAll('.cck:checked')].map(c=>c.dataset.cid);
  if (!ids.length) return alert('请先勾选用例');
  if (action === 'reject') {
    const comment = window.prompt(`批量驳回 ${ids.length} 条，统一审核意见（必填）：`, '与已有用例重复，请合并处理');
    if (!comment || !comment.trim()) return;
    return casesReview(ids.map(cid=>({case_id:cid, action:'reject', comment:comment.trim()})));
  }
  casesReview(ids.map(cid=>({case_id:cid, action})));
}
async function fixCases() {
  const btn = $('fixCaseBtn'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> AI 修改中…'; }
  try {
    const data = await api(`/api/v1/tasks/${currentTask.task_id}/cases/fix`, {method:'POST'});
    lastCaseDiff = data;
    await openTask(currentTask.task_id, true);
  } catch (e) { alert('修改失败: ' + e.message); renderDetail(); }
}
function openEdit(caseId) {
  editingCase = currentTask.result.cases.find(c => c.case_id === caseId);
  const c = editingCase;
  $('editCaseId').textContent = caseId;
  $('eTitle').value = c.title; $('ePrio').value = c.priority;
  $('ePre').value = c.precondition; $('eRemark').value = c.remark || '';
  $('eKeywords').value = c.keywords || '';
  $('eSteps').value = (c.steps||[]).map(s=>`${s.action} => ${s.expected}`).join('\n');
  $('eFeedback').value = '';
  $('editDlg').showModal();
}
function saveEdit() {
  const steps = $('eSteps').value.split('\n').filter(l=>l.trim()).map(l=>{
    const [action, expected=''] = l.split('=>');
    return {action: action.trim(), expected: expected.trim()};
  });
  const item = {case_id: editingCase.case_id, action:'modify', feedback:$('eFeedback').value, case:{
    ...editingCase, title:$('eTitle').value, priority:$('ePrio').value,
    precondition:$('ePre').value, remark:$('eRemark').value, keywords:$('eKeywords').value, steps
  }};
  $('editDlg').close();
  casesReview([item]);
}

/* ---- 需求变更 ---- */
async function reqDiff() {
  const text = $('newReqText').value.trim();
  if (!text) return alert('请粘贴新版需求内容');
  $('reqDiffBtn').disabled = true; $('reqDiffBtn').innerHTML = '<span class="spin"></span> 分析中…';
  try {
    await jpost(`/api/v1/tasks/${currentTask.task_id}/requirement-diff`, {new_requirement:text});
    await openTask(currentTask.task_id, true);
  } catch (e) { alert('分析失败: ' + e.message); renderDetail(); }
}
async function applyReqDiff() {
  if (!window.confirm('按差异分析结果应用最小范围更新？只有受影响用例会创建新版本，其余不动。')) return;
  const btn = $('applyDiffBtn'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 更新中…'; }
  try {
    const data = await api(`/api/v1/tasks/${currentTask.task_id}/requirement-diff/apply`, {method:'POST'});
    lastCaseDiff = data;
    await openTask(currentTask.task_id, true);
    if ((data.removed_marks||[]).length) alert('存在删除类变更：相关用例仅标记受影响，请人工决定保留/作废');
  } catch (e) { alert('应用失败: ' + e.message); renderDetail(); }
}

/* ---- 对话修订 ---- */
async function reviseGo() {
  const instruction = $('reviseInput').value.trim();
  if (!instruction) return;
  $('reviseBtn').disabled = true; $('reviseBtn').innerHTML = '<span class="spin"></span>';
  try {
    await jpost(`/api/v1/tasks/${currentTask.task_id}/revise`, {instruction});
    refreshMemories();
    await openTask(currentTask.task_id);
  } catch (e) { alert('修订失败: ' + e.message); }
  $('reviseBtn').disabled = false; $('reviseBtn').textContent = '发送';
}

/* ---- 终稿上传 ---- */
function renderDiff(o) {
  const s = o.stats;
  return `<div style="margin-top:8px">
    <b>${esc(o.filename)}</b> 对比结果：完全采纳率 <b>${(s.adoption_rate*100).toFixed(1)}%</b>
    （新增 ${s.added} / 删除 ${s.deleted} / 修改 ${s.modified} / 未改动 ${s.unchanged}）
    <div class="chips">
      ${o.added.map(x=>'<span>新增: '+esc(x.title)+'</span>').join('')}
      ${o.deleted.map(x=>'<span>删除: '+esc(x.title)+'</span>').join('')}
      ${o.modified.map(x=>'<span>修改: '+esc(x.title)+'（'+x.changes.map(c=>esc(c.field)).join('/')+'）</span>').join('')}
    </div></div>`;
}
async function uploadFinal() {
  const f = $('finalFile').files[0];
  if (!f) return alert('请选择终稿文件');
  const fd = new FormData(); fd.append('file', f);
  try {
    await api(`/api/v1/tasks/${currentTask.task_id}/final`, {method:'POST', body:fd});
    openTask(currentTask.task_id, true);
  } catch (e) { alert('上传失败: ' + e.message); }
}

init();
</script>
