[project]
name = "tiangong"
version = "0.1.0"
description = "AI 测试用例生成 Agent（TestCase Agent）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "openai>=1.40",
    "python-docx>=1.1",
    "langgraph>=0.2",
    "celery>=5.4",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "qdrant-client>=1.9",
    "loguru>=0.7",
    "qrcode>=7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
